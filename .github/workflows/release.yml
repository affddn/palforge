name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps a release PR open with the next version and changelog; merging it tags vX.Y.Z and publishes the release.
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  palctl-binary:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      - run: vp run palctl#build
      - run: gh release upload "$TAG" apps/palctl/dist/palctl-linux-x64 --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}

  modbuilder-image:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
      - run: |
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version="$VERSION" tools/modbuilder
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/palforge-modbuilder
          VERSION: ${{ needs.release-please.outputs.version }}
